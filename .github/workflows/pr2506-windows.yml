name: LCM-X #2506 Windows unload probe

on:
  push:
    branches: [verify/pr2506-windows]

permissions:
  contents: read

jobs:
  unload:
    runs-on: windows-2025
    timeout-minutes: 15
    environment: pr2506-windows-candidate
    env:
      HERMES_SHA: 5691c9fa47b16a546a5fa418a9e76fddcfbf2701
      PR_HEAD_SHA: b457d8b2743c2fe6896cd4fc015e3540819cb3b2
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Fetch and check the pinned public revisions
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          function Get-Revision($Directory, $Repository, $Sha) {
            git init --quiet $Directory
            git -C $Directory fetch --quiet --no-tags --depth=1 $Repository $Sha
            git -C $Directory checkout --quiet --detach FETCH_HEAD
            if ((git -C $Directory rev-parse HEAD) -cne $Sha) { throw "Unexpected revision in $Directory" }
            Write-Host "$Directory $Sha"
          }
          Get-Revision hermes-agent https://github.com/NousResearch/hermes-agent.git $env:HERMES_SHA
          Get-Revision follow-next https://github.com/supplefrog/lcm-x.git $env:PR_HEAD_SHA

      - name: Restore the exact candidate if supplied
        env:
          CANDIDATE_CHAIN: ${{ secrets.LCMX_PR2506_BUNDLE_CHAIN }}
        run: python -B restore_candidate.py

      - name: Install the pinned Hermes environment
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check uv==0.11.26
          uv sync --project hermes-agent --locked --no-dev --python 3.14

      - name: Run Windows unload, reload, and maintainer regression probes
        run: |
          $hermesPython = Join-Path $PWD 'hermes-agent/.venv/Scripts/python.exe'
          function Invoke-Probe($Script, $Arguments) {
            $transcript = & $hermesPython -X utf8 -B $Script @Arguments 2>&1
            $status = $LASTEXITCODE
            $transcript | ForEach-Object {
              if ("$_" -match '^[a-f0-9]{40} upstream [a-z-]+ exit [0-9]+') { Write-Host $Matches[0] }
              if ("$_" -match '^(Deleted lcm\.db in the live Hermes process|lcm\.db deleted inside live Hermes process)$') { Write-Host $_ }
            }
            if ($status -ne 0) {
              if ($env:TESTED_SHA -eq $env:PR_HEAD_SHA) { $transcript | Write-Host }
              throw "Windows probe $Script exited $status"
            }
          }
          $env:LCMX_PROOF_SOURCE = 'follow-next'
          Write-Host "Testing $env:TESTED_SHA on Hermes $env:HERMES_SHA"
          Invoke-Probe reproduce.py @('--expect-fixed')
          Write-Host 'Completed-turn unload: SQLite handles released and lcm.db deleted in the live process'
          Invoke-Probe review-5914142904/native.py @($env:TESTED_SHA, 'upstream', 'new-used', 'preflight-gap', 'compress-gap', 'preflight-clone', 'compress-clone')
          Invoke-Probe worker-5931574277-evidence/maintainer_native.py @($env:TESTED_SHA, 'upstream', 'resume-finalized-gap', 'branch-gap-close', 'undo-first', 'new-retry')
          if ($env:TESTED_SHA -ne $env:PR_HEAD_SHA) {
            Invoke-Probe worker-6965624944-evidence/cooldown_native.py @($env:TESTED_SHA, 'upstream', 'merged-cooldown')
          }
